<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Códigos JavaScript</title>
</head>

<body>
    <h1>Códigos JavaScript</h1>
  

    <script>
        /*Variables*/
        var a = 3 + 2;// a vale 5
        a += 6;// a vale 11 (5+6)
        var b = a * 7;// b vale 77 (11*7)
        a < b;// true (verdadero)
        a >= b;// false (falso)

        /*Variable let*/
        let an = "hola";
        let bn = 5;

        /*Ejemplo 57*/
        var a = 5;
        var b = 10;

        if (a === 5) {
            let a = 4; // El alcance es dentro del bloque if
            var b = 1; // El alcance es global

            console.log(a); // 4
            console.log(b); // 1
        }

        console.log(a); // 5
        console.log(b); // 1


        /*Ejemplo 58*/
        function multiplicar(a, b) {
            var prod = 0;
            var i = 1;
            while (i <= b) {
                prod += a;
                i++;
            }
            return prod;
        }
        //En consola
        console.log(multiplicar(2, 3)); // Resultado: 6
        console.log(multiplicar(10, 100)); // Resultado: 1000



        /*Arrays*/
        var nombre_array = ["valor0", "valor1", "...", "valorN-1"];
        var sin_inicializar = new Array(5);

        console.log(nombre_array[0]);
        nombre_array[1] = "otro valor";
        console.log(sin_inicializar[7]); // Fuera de rango: undefined


        /*Ejemplo 59*/
        var lista = [12, 10, 4, 35];

        // Ahora mostramos el contenido
        for (i = 0; i < lista.length; i++) {
            console.log(lista[i] + " ");
        }

        /*Cadenas*/
        var cadena = "hola" + " mundo";
        console.log(cadena[0]); // Muestra la "h"

    </script>
</body>

</html>
